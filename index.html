<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Finger Trainer" />
<meta name="theme-color" content="#F7F7FB" />
<title>Finger Trainer</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="motion.css" />
</head>
<body>
  <!-- ===== Main scrollable view ===== -->
  <main id="view"></main>

  <!-- ===== Bottom tab bar (labels + active dot, per Daylight Chunky mock) ===== -->
  <nav id="tabbar">
    <button class="tab" data-tab="today"><span>Today</span><span class="dot"></span></button>
    <button class="tab" data-tab="program"><span>Program</span><span class="dot"></span></button>
    <button class="tab" data-tab="analytics"><span>Analytics</span><span class="dot"></span></button>
    <button class="tab" data-tab="history"><span>History</span><span class="dot"></span></button>
    <button class="tab" data-tab="settings"><span>Settings</span><span class="dot"></span></button>
  </nav>

  <!-- ===== Modal host (sheets, runner, dialogs) ===== -->
  <div id="modal-host"></div>

  <script src="calc.js"></script>
  <script src="templates.js"></script>
  <script src="db.js"></script>
  <script src="sync.js"></script>
  <script src="timer.js"></script>
  <script src="builder.js"></script>
  <script src="cone_data.js"></script>
  <script src="cone.js"></script>
  <script src="kalman_data.js"></script>
  <script src="kalman.js"></script>
  <script src="rpe_cal.js"></script>
  <script src="app.js"></script>
  <script src="motion.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
