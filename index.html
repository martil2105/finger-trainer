<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Finger Trainer" />
<meta name="theme-color" content="#0a0a0f" />
<title>Finger Trainer</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ===== Main scrollable view ===== -->
  <main id="view"></main>

  <!-- ===== Bottom tab bar ===== -->
  <nav id="tabbar">
    <button class="tab" data-tab="today"><span class="ti">◎</span><span>Today</span></button>
    <button class="tab" data-tab="program"><span class="ti">▦</span><span>Program</span></button>
    <button class="tab" data-tab="analytics"><span class="ti">📈</span><span>Analytics</span></button>
    <button class="tab" data-tab="history"><span class="ti">≣</span><span>History</span></button>
    <button class="tab" data-tab="settings"><span class="ti">⚙</span><span>Settings</span></button>
  </nav>

  <!-- ===== Modal host (sheets, runner, dialogs) ===== -->
  <div id="modal-host"></div>

  <script src="calc.js"></script>
  <script src="templates.js"></script>
  <script src="db.js"></script>
  <script src="timer.js"></script>
  <script src="builder.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
